<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Widget Test</title>
    <link rel="stylesheet" href="./templates/asd-cta-theme.css" />
  </head>
  <body style="padding: 2rem; font-family: sans-serif; background: #f5f5f5;">
    <h2>Prefilter (3 questions)</h2>
    <div class="asd-cta-prefilter">
      <div
        class="asd-cta-widget"
        data-cta-type="prefilter"
        data-redirect-url="http://localhost:3001/listings"
      ></div>
    </div>

    <hr style="margin: 2rem 0;" />

    <h2>Single dropdown</h2>
    <div class="asd-cta-single-dropdown">
      <div
        class="asd-cta-widget"
        data-cta-type="single-dropdown"
        data-question-key="subjectArea"
        data-redirect-url="http://localhost:3001/listings"
      ></div>
    </div>

    <hr style="margin: 2rem 0;" />

    <h2>Button only</h2>
    <div class="asd-cta-button">
      <div
        class="asd-cta-widget"
        data-cta-type="button"
        data-button-label="FIND SCHOOLS"
        data-redirect-url="http://localhost:3001/listings"
      ></div>
    </div>

    <script>
      window.ASD_SETTINGS = {
        marketContext: "api",
        utm_medium: "direct",
        utm_source: "other",
        utm_campaign: "",
        utm_content: "",
        cid: "",
        pid: "",
        KTID: ""
      };
    </script>
    <script src="./dist/widget.js"></script>
  </body>
</html>
